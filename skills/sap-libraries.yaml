  - name: sap_books_implementation
    canonical_name: Книги по внедрению SAP
    versions: [2026.8.29]
    version_kind: snapshot
    audiences: [consultant]
    description: архитектура, миграция, BPM, управление проектом и эксплуатация SAP
    aliases: [SAP implementation, SAP migration, SAP project]
    keywords: [implementation methodology, migration, project management, architecture, BPM]
