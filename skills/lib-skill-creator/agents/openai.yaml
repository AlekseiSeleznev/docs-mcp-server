interface:
  display_name: "Создание библиотечных навыков"
  short_description: "Создаёт, обновляет и проверяет lib-*"
  default_prompt: "Используй $lib-skill-creator, чтобы создать или обновить навык lib-* и проверить его структуру и поведение."

dependencies:
  tools:
    - type: "mcp"
      value: "lib-docs"
      transport: "streamable_http"
      url: "https://aichat.msgplaut.com/lib-docs/mcp"
      description: "Read-only библиотека для проверки имён, версий и результатов поиска"

policy:
  allow_implicit_invocation: true
