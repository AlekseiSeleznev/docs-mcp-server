interface:
  display_name: "Создание быстрых библиотечных навыков"
  short_description: "Создаёт и сравнивает профили lib-*"
  default_prompt: "Используй $lib-skill-creator, чтобы безопасно создать, перенести или ускорить навык lib-* с сравнительными тестами."

dependencies:
  tools:
    - type: "mcp"
      value: "lib-docs"
      description: "Read-only библиотека для проверки имён, версий и результатов поиска"

policy:
  allow_implicit_invocation: true
